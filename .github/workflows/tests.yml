name: tests

on:
  # Scoped to main on purpose. `push: ["**"]` alongside `pull_request` ran
  # the whole matrix TWICE for every push to a branch with an open PR --
  # once for each trigger, identical work. Branch commits are covered by
  # the pull_request run; this leaves push to cover main itself, including
  # merge commits, which no PR event fires for.
  #
  # Tradeoff, stated: a branch with no open PR now gets no CI until one is
  # opened. That's the usual shape and the cost is a run you didn't need.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel 3.13 just because 3.12 failed -- knowing whether a
      # break is version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # 3.12 is the declared floor (numpy and xgboost both require it);
        # 3.13 is the current release. Both are verified working.
        python-version: ["3.12", "3.13"]

    steps:
      # checkout@v4 and setup-python@v5 run on Node 20, which GitHub has
      # deprecated -- the runner was already force-migrating them to Node
      # 24 and warning on every job. These majors run on Node 24 natively.
      # Verified before bumping that python-version, cache and
      # cache-dependency-path all still exist as inputs here.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Deliberately the same script SETUP.md tells a new user to run, not a
      # bespoke CI install. If the documented setup path breaks, this job
      # goes red -- which is the point: requirements.txt was internally
      # unsatisfiable (pyarrow==25 vs streamlit's pyarrow<25) and nothing
      # caught it, because nothing ever ran the documented install.
      - name: Install (the documented path)
        run: bash scripts/install.sh

      - name: Run tests
        run: python -m pytest -q

      # The suite's stated contract is that it needs no network and no
      # credentials -- it runs on synthetic data only. Enforce that rather
      # than trusting it: two tests had silently started reaching nflverse
      # for the live season's schedule and passed only on machines with a
      # warm cache. Pointing the proxy vars at a dead port makes any real
      # outbound call fail fast.
      #
      # Set via the shell's `env` command rather than a step-level `env:`
      # block ON PURPOSE -- do not "tidy" this back into `env:`. GitHub's
      # workflow parser treats env keys as CASE-INSENSITIVE, so listing
      # both HTTP_PROXY and http_proxy there is a duplicate-key error that
      # rejects the whole file ("Invalid workflow file ... is already
      # defined") and fails the run at startup with zero jobs and no logs.
      # Both casings are genuinely needed: urllib reads the lowercase
      # names, and other clients read the uppercase ones.
      - name: Run tests with no network (enforces the no-network contract)
        run: |
          env HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
              http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
              NO_PROXY= no_proxy= \
              python -m pytest -q
